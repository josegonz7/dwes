<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Diario de Estudio</h1>
        </header>

        <section class="streak-section">
            <div class="streak-value" id="streak-display">0</div>
            <div class="streak-label">🔥 días seguidos</div>
        </section>

        <section class="form-section">
            <h2>Nueva sesión</h2>
            <form id="session-form">
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="topic">Tema</label>
                    <input type="text" id="topic" name="topic" placeholder="Ej: JavaScript, React, Algoritmos..." required>
                </div>
                <div class="form-group">
                    <label for="minutes">Minutos</label>
                    <input type="number" id="minutes" name="minutes" min="1" placeholder="Ej: 45" required>
                </div>
                <button type="submit" class="btn-primary">Guardar sesión</button>
            </form>
        </section>

        <section class="sessions-section">
            <h2>Sesiones</h2>
            <ul id="sessions-list" class="sessions-list">
                <!-- Las sesiones se insertan aquí dinámicamente -->
            </ul>
            <p id="empty-message" class="empty-message" hidden>No hay sesiones aún. ¡Añade tu primera sesión arriba!</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
